[package]
name = "bingrove-plugin"
description = "Bingrove as a Meshgrove plugin: Gridfinity drawer inserts planned, generated and put on print lists"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bingrove-core = { path = "../bingrove-core" }
# The plugin interface of Meshgrove, MIT OR Apache-2.0. Until it is published, a local checkout
# of the Meshgrove repository next to this one (see scripts/build.sh).
meshgrove-plugin-api = { path = "../../../stl_browser/crates/meshgrove-plugin-api", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# Not part of the native workspace: built for wasm32-wasip2 only.
[workspace]
