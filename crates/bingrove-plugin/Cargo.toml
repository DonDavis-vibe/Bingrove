[package]
name = "bingrove-plugin"
description = "Bingrove as a Meshgrove plugin: Gridfinity drawer inserts planned, generated and put on print lists"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bingrove-core = { path = "../bingrove-core" }
# The plugin interface of Meshgrove, MIT OR Apache-2.0, pinned to the Meshgrove commit the plugin
# was built against (the API's major.minor is what counts at run time). For work on both at once,
# point it at a checkout instead: put
#   [patch."https://github.com/DonDavis-vibe/MeshGrove"]
#   meshgrove-plugin-api = { path = "../stl_browser/crates/meshgrove-plugin-api" }
# into .cargo/config.toml (not committed).
meshgrove-plugin-api = { git = "https://github.com/DonDavis-vibe/MeshGrove", tag = "v0.8.0", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# Not part of the native workspace: built for wasm32-wasip2 only.
[workspace]
