[workspace]
resolver = "3"
members = ["crates/bingrove-core", "crates/bingrove-cli"]
# The plugin is a wasm32-wasip2 cdylib with its own lock file; scripts/build.sh builds it.
exclude = ["crates/bingrove-plugin"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Davis (German Redneck Engineering)"]
homepage = "https://redneck-design.de/"
description = "Gridfinity drawer inserts with edge bins that use the whole drawer"
publish = false

[workspace.dependencies]
bingrove-core = { path = "crates/bingrove-core" }
# Pure-Rust port of Manifold (no C++ toolchain, builds for wasm32-wasip2). Pinned: 0.x, spare-time maintained.
manifold-rust = "=0.19.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
# The geometry kernel is painfully slow unoptimized; keep our own code debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
