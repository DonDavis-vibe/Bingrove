name: Release

# A tag v* publishes the plugin: the .wasm, its checksum and the notes of that version from
# CHANGELOG.md, as a pre-release while Bingrove is below 1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  plugin:
    name: Build and publish bingrove.wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bingrove-plugin
      - name: Build the plugin
        run: scripts/build.sh
      - name: Checksum
        run: |
          cd target/plugin
          sha256sum bingrove.wasm > bingrove.wasm.sha256
          cat bingrove.wasm.sha256
      - name: Notes from the changelog
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: true
          files: |
            target/plugin/bingrove.wasm
            target/plugin/bingrove.wasm.sha256
