name: Release

# A tag v* publishes the plugin as a full release: the .wasm, its checksum and the notes of that
# version from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  plugin:
    name: Build and publish bingrove.wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bingrove-plugin
      - name: Build the plugin
        run: scripts/build.sh
      - name: Checksum
        run: |
          cd target/plugin
          sha256sum bingrove.wasm > bingrove.wasm.sha256
          cat bingrove.wasm.sha256
      - name: Notes from the changelog
        id: notes
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Bingrove ${{ steps.notes.outputs.version }}
          body_path: notes.md
          prerelease: false
          files: |
            target/plugin/bingrove.wasm
            target/plugin/bingrove.wasm.sha256
